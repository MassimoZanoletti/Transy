<div class="the-container">
   <p-card header="{{operazione}}Utente">
      <ng-template pTemplate="content">
         <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text"
                   id="nome"
                   [(ngModel)]="nome"
                   pInputText
                   required/>
         </div>

         <div class="form-group">
            <label for="password">Password:</label>
            <input type="text"
                   id="password"
                   [(ngModel)]="password"
                   pInputText
                   required/>
         </div>

         <!-- ruolo e livello di permessi: modificabili solo dall'amministratore, scegliendo il tipo di utente
              (che imposta descrizione e attributo) -->
         <div *ngIf="ShowRuolo()" class="form-group">
            <label for="tipo">Ruolo:</label>
            <p-dropdown inputId="tipo"
                        [options]="tipiUtente"
                        [(ngModel)]="tipoUtente"
                        (ngModelChange)="TipoUtenteCambiato()"
                        optionLabel="desc"
                        placeholder="Seleziona il ruolo"
                        appendTo="body"
                        [style]="{ 'min-width': '15rem' }"></p-dropdown>
         </div>

         <div *ngIf="theError" class="error-message">{{ errorMessage }}</div>
      </ng-template>

      <ng-template pTemplate="footer">
         <div class="footer-buttons">
            <button
               pButton
               type="button"
               label="Annulla"
               class="p-button-secondary"
               (click)="Annulla()"
            ></button>
            <button
               pButton
               type="button"
               label="OK"
               class="p-button-primary"
               [disabled]="isLoading || isSaving"
               [loading]="isSaving"
               (click)="Salva()"
            ></button>
         </div>
      </ng-template>
   </p-card>
</div>
