<div class="the-container">
   <p-card header="{{operazione}}Utente">
      <ng-template pTemplate="content">
         <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text"
                   id="nome"
                   [(ngModel)]="nome"
                   pInputText
                   required/>
         </div>

         <div class="form-group">
            <label for="password">Password:</label>
            <input type="text"
                   id="password"
                   [(ngModel)]="password"
                   pInputText
                   required/>
         </div>

         <!-- ruolo e livello di permessi: modificabili solo dall'amministratore -->
         <div *ngIf="ShowRuolo()" class="form-group">
            <label for="ruolo">Ruolo:</label>
            <input type="text"
                   id="ruolo"
                   [(ngModel)]="ruoloDesc"
                   pInputText/>
         </div>

         <div *ngIf="ShowRuolo()" class="form-group">
            <label for="attributo">Attributo:</label>
            <p-inputNumber inputId="attributo"
                           [(ngModel)]="ruoloAttrib"
                           [min]="0"
                           [max]="255"
                           [showButtons]="true"></p-inputNumber>
         </div>

         <div *ngIf="theError" class="error-message">{{ errorMessage }}</div>
      </ng-template>

      <ng-template pTemplate="footer">
         <div class="footer-buttons">
            <button
               pButton
               type="button"
               label="Annulla"
               class="p-button-secondary"
               (click)="Annulla()"
            ></button>
            <button
               pButton
               type="button"
               label="OK"
               class="p-button-primary"
               [disabled]="isLoading || isSaving"
               [loading]="isSaving"
               (click)="Salva()"
            ></button>
         </div>
      </ng-template>
   </p-card>
</div>
