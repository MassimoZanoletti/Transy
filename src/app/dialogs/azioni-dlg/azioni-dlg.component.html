
<div class="div-azioni-content">
   <p-table
      id="table-azioni"
      class="table-azioni-flex"
      styleClass="p-datatable-gridlines p-datatable-sm"
      [scrollable]="true"
      scrollHeight="flex"
      [value]="GetOperList()"
   >
      <ng-template pTemplate="header">
         <tr>
            <th style="width: 40px;">Q</th>
            <th style="width: 60px;">Time</th>
            <th style="width: 90px;">Oper</th>
            <th style="width: 90px;">TmCr</th>
            <th>Pl</th>
            <th>Dt</th>
            <th style="width: 90px;"></th>
         </tr>
      </ng-template>
      <ng-template pTemplate="body" let-op>
         <tr>
            <td>{{ GetOperQuarterStr(op) }}</td>
            <td>{{ GetOperTimeStr(op) }}</td>
            <td [ngClass]="GetOperBgClass(op)">{{ TOperationType.Desc(op.oper()) }}</td>
            <td [ngClass]="GetOperTmCrClass(op)">{{ op.MyTeamStr() }}</td>
            <td>{{ GetOperPlayerStr(op) }}</td>
            <td>{{ GetOperDescStr(op) }}</td>
            <td>
               <p-button icon="pi pi-pencil"
                         severity="secondary"
                         styleClass="p-button-text"
                         (onClick)="BtnModificaAzione(op)">
               </p-button>
               <p-button icon="pi pi-trash"
                         severity="danger"
                         styleClass="p-button-text"
                         (onClick)="BtnEliminaAzione(op)">
               </p-button>
            </td>
         </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
         <tr>
            <td colspan="7">Nessuna operazione registrata</td>
         </tr>
      </ng-template>
   </p-table>
   <div class="div-azioni-footer">
      <p-button label="Elimina tutto"
                icon="pi pi-times"
                severity="danger"
                (onClick)="BtnEliminaTutteAzioni()">
      </p-button>
      <p-button label="Chiudi"
                icon="pi pi-check"
                severity="secondary"
                (onClick)="BtnChiudi()">
      </p-button>
   </div>
</div>
