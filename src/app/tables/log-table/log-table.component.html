<div id="main_container">

   <div class="card flex justify-content-start"
        id="div-page-header">
      <p-card [style]="{ width: '100%' }"
              contentStyleClass="card-contenuto-ridotto">
         <div style="display: flex; align-items: center; gap: 12px;">
            <h2 style="margin-left: 15px; margin-right: 18px; margin-bottom: 0px; margin-top: 0px; padding-bottom: 0px; padding-top: 0px;">Log</h2>
            <p-button
               class="p-button-table"
               icon="pi pi-refresh"
               severity="secondary"
               pTooltip="Ricarica"
               tooltipPosition="top"
               (click)="LoadData()"
            ></p-button>
            <span class="p-input-icon-left">
               <i class="pi pi-search"></i>
               <input pInputText
                      type="text"
                      placeholder="Cerca (utente, operazione, dettagli...)"
                      style="width: 22rem;"
                      (input)="tabella.filterGlobal($any($event.target).value, 'contains')"/>
            </span>
            <span class="log-conteggio">Ultime {{ tblData.length }} righe (le più recenti in fondo)</span>
         </div>
      </p-card>
   </div>

   <p-blockUI [blocked]="isLoading">
      <p-progressSpinner></p-progressSpinner>
   </p-blockUI>

   <div id="div-tabella-bottoni">
      <div class="card"
           id="div-tabella">
         <p-table
            #tabella
            class="custom-header-table"
            styleClass="p-datatable-gridlines"
            [scrollable]="true"
            [scrollHeight]="scrollHeight"
            [value]="tblData"
            [globalFilterFields]="['timecode', 'username', 'operation', 'parameters']"
            dataKey="id"
            [tableStyle]="{ 'min-width': '50rem' }">
            <ng-template pTemplate="header">
               <tr>
                  <th style="width: 85px;">Id</th>
                  <th style="width: 190px;">Data/ora</th>
                  <th style="width: 200px;">Utente</th>
                  <th style="width: 150px;">Operazione</th>
                  <th>Dettagli</th>
               </tr>
            </ng-template>
            <ng-template pTemplate="body"
                         let-elemento
                         let-rowIndex="rowIndex">
               <tr [ngClass]="getRowColorClass(rowIndex)">
                  <td><span class="log-id">{{ elemento.id }}</span></td>
                  <td>{{ elemento.timecode }}</td>
                  <td>{{ elemento.username }} <span class="log-id">({{ elemento.userid }})</span></td>
                  <td [class.log-errore]="elemento.operation === 'Errore' || elemento.operation === 'Login fallito'">{{ elemento.operation }}</td>
                  <td class="log-dettagli">{{ elemento.parameters }}</td>
               </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
               <tr>
                  <td colspan="5">Nessuna riga di log</td>
               </tr>
            </ng-template>
         </p-table>
      </div>
   </div>
</div>
